# Application
spring.application.name=store-service
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Flyway manages DDL migrations; Hibernate validates schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
# HikariCP Connection Pool Optimization (TOGAF Performance & Resource Sizing)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000

# PostgreSQL Fast Startup Optimization: Avoid initial JDBC metadata network calls
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration${FLYWAY_ADDITIONAL_LOCATIONS:}


# Services Inter-microservices
services.users.url=${USERS_SERVICE_URL:http://users-service:8080}

# S3 / MinIO Object Storage
s3.endpoint=${S3_ENDPOINT:http://minio:9000}
s3.bucket-name=${S3_BUCKET_NAME:store-images}
s3.products-bucket-name=${S3_PRODUCTS_BUCKET_NAME:product-images}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.region=${S3_REGION:us-east-1}
s3.public-base-url=${S3_PUBLIC_BASE_URL:}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Spring Boot Actuator & Health Probes (Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized


# Security / JWT Configuration
application.security.jwt.public-key=${JWT_PUBLIC_KEY:}
application.security.jwt.issuer=shoploc-auth-service

# Spring Mail (SMTP / Mailpit - SLE-59, SLE-250)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.from=${MAIL_FROM:contact@shop-loc.fr}


# Timeouts par défaut des clients HTTP sortants (RestClient auto-configuré) : évite de bloquer
# les threads Tomcat si un service distant (ex. users-service) est lent ou injoignable.
spring.http.client.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:2s}
spring.http.client.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}

# Standard RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=true

# Distributed Tracing (W3C Trace Context & OpenTelemetry)
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
