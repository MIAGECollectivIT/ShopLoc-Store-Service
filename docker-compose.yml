services:
  # CONTAINER 1: PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # CONTAINER 2: Spring Boot Backend
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080" # Default Spring Boot port
    environment:
      # Automatically recognized by Spring Boot
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/app_db
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      FLYWAY_ADDITIONAL_LOCATIONS: ",classpath:db/devdata"
    depends_on:
      db:
        condition: service_healthy

volumes:
   db_data:
