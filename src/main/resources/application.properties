# Application
spring.application.name=store-service
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
spring.datasource.username=${DB_USER:devuser}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate (Flyway manages DDL migrations; Hibernate validates schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration${FLYWAY_ADDITIONAL_LOCATIONS:}


# Services Inter-microservices
services.users.url=${USERS_SERVICE_URL:http://users-service:8080}

# S3 / MinIO Object Storage
s3.endpoint=${S3_ENDPOINT:http://minio:9000}
s3.bucket-name=${S3_BUCKET_NAME:store-images}
s3.access-key=${S3_ACCESS_KEY:devadmin}
s3.secret-key=${S3_SECRET_KEY}
s3.region=${S3_REGION:us-east-1}
s3.public-base-url=${S3_PUBLIC_BASE_URL:}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Spring Boot Actuator & Health Probes (Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
