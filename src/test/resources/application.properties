spring.application.name=service-shop-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
management.endpoint.health.probes.enabled=true
spring.flyway.enabled=false
services.users.url=http://localhost:8089
s3.endpoint=http://localhost:9000
s3.bucket-name=store-images
s3.access-key=testadmin
s3.secret-key=testpassword
s3.region=us-east-1
s3.public-base-url=http://localhost:9000/store-images
