apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-shop
  namespace: shoploc
  labels:
    app: service-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-shop
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: service-shop
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: service-shop
          image: ghcr.io/miagecollectivit/service-shop:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: "db-shop"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: service-shop
  namespace: shoploc
  labels:
    app: service-shop
spec:
  type: ClusterIP
  selector:
    app: service-shop
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
