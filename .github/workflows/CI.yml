name: CI

on:
  pull_request:
    branches: [ "main", "dev" ]
    # Globally ignore files that have no impact on the build execution
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Check Spotless formatting
        run: ./mvnw spotless:check

      - name: Run PMD static analysis
        run: ./mvnw pmd:check

      - name: Build and Test with Maven
        run: ./mvnw clean verify